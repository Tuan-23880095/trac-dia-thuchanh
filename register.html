<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản | Hệ thống Trắc địa HCMUS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .register-card {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-900 antialiased py-10">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-xl w-full bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-gray-100 register-card">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-block mb-3 text-blue-600 hover:text-blue-700 transition-colors">
                    <svg class="w-8 h-8 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </a>
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Tạo tài khoản mới</h2>
                <p class="mt-2 text-sm text-gray-500">Dành cho sinh viên học phần Trắc địa đại cương</p>
            </div>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-5">
                
                <!-- Grid 2 cột cho các màn hình lớn -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- MSSV -->
                    <div>
                        <label for="mssv" class="block text-sm font-semibold text-gray-700 mb-1">Mã số sinh viên <span class="text-red-500">*</span></label>
                        <input id="mssv" name="mssv" type="text" required pattern="[0-9]{8}" title="MSSV phải gồm 8 chữ số"
                            class="w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm" 
                            placeholder="Ví dụ: 22110001">
                    </div>
                    
                    <!-- Lớp -->
                    <div>
                        <label for="classId" class="block text-sm font-semibold text-gray-700 mb-1">Mã Lớp <span class="text-red-500">*</span></label>
                        <select id="classId" name="classId" required
                            class="w-full px-4 py-3 border border-gray-300 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm bg-white">
                            <option value="" disabled selected>-- Chọn lớp học --</option>
                            <option value="GEO25A">GEO25A (K25 Địa chất)</option>
                            <option value="GEO25B">GEO25B (K25 Địa chất)</option>
                            <option value="ENV25">ENV25 (K25 Môi trường)</option>
                            <!-- Các option này sau này có thể render động từ Google Sheets -->
                        </select>
                    </div>
                </div>

                <!-- Họ và tên -->
                <div>
                    <label for="fullname" class="block text-sm font-semibold text-gray-700 mb-1">Họ và tên đầy đủ <span class="text-red-500">*</span></label>
                    <input id="fullname" name="fullname" type="text" required 
                        class="w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm" 
                        placeholder="Nguyễn Văn A">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email sinh viên <span class="text-red-500">*</span></label>
                    <input id="email" name="email" type="email" required 
                        class="w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm" 
                        placeholder="22110001@student.hcmus.edu.vn">
                </div>

                <!-- Mật khẩu -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Mật khẩu <span class="text-red-500">*</span></label>
                        <input id="password" name="password" type="password" required minlength="6"
                            class="w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm" 
                            placeholder="••••••••">
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-1">Xác nhận mật khẩu <span class="text-red-500">*</span></label>
                        <input id="confirmPassword" name="confirmPassword" type="password" required minlength="6"
                            class="w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm" 
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Error/Success Message Placeholder -->
                <div id="statusMessage" class="hidden mt-4 p-3 rounded-xl text-sm text-center font-medium border">
                </div>

                <!-- Nút Submit -->
                <div class="pt-2">
                    <button type="submit" id="registerBtn"
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all shadow-lg active:scale-95">
                        Đăng ký tài khoản
                    </button>
                </div>
            </form>

            <div class="text-center mt-6 pt-6 border-t border-gray-100">
                <p class="text-sm text-gray-600">
                    Đã có tài khoản? 
                    <a href="login.html" class="font-bold text-blue-600 hover:text-blue-500 transition-colors">Đăng nhập tại đây</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('registerBtn');
            const statusDiv = document.getElementById('statusMessage');
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            // Xóa trạng thái cũ
            statusDiv.className = 'hidden mt-4 p-3 rounded-xl text-sm text-center font-medium border';
            
            // 1. Kiểm tra mật khẩu khớp nhau (Client-side Validation)
            if (pass !== confirmPass) {
                statusDiv.innerText = 'Mật khẩu xác nhận không khớp!';
                statusDiv.classList.add('bg-red-50', 'text-red-600', 'border-red-200');
                statusDiv.classList.remove('hidden');
                return;
            }

            // 2. Hiệu ứng Loading
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Đang xử lý...
            `;
            statusDiv.classList.add('hidden');

            // 3. Giả lập gửi API lên Google Apps Script (Sẽ code thật trong file api.js)
            // Kịch bản: Apps Script sẽ check MSSV này có trong file "Danh_Sach_Lop_(25-26_HK2).xlsx" không.
            setTimeout(() => {
                // Thành công giả lập
                btn.innerHTML = 'Đăng ký thành công!';
                btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                btn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
                
                statusDiv.innerText = 'Đăng ký thành công! Đang chuyển hướng đến trang đăng nhập...';
                statusDiv.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
                statusDiv.classList.remove('hidden');

                // Chuyển hướng sau 2 giây
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            }, 1500);
        });
    </script>
</body>
</html>
